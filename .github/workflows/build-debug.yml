name: Build / Debug

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: apk
        uses: ./.github/actions/build-apk
        with:
          variant: debug
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.apk }}
          archive: false
